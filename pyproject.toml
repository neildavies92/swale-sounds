[project]
name = "swale-sounds"
version = "0.1.0"
description = "Local-first music and ambience production foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "openai>=3.22.1,<4",
]

[project.scripts]
swale-sounds = "swale_sounds.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6"]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
